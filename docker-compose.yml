services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: gvpathshala
      POSTGRES_PASSWORD: gvpathshala
      POSTGRES_DB: gvpathshala
    ports: ["5432:5432"]
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./server/prisma/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gvpathshala"]
      interval: 5s
      retries: 10
volumes:
  dbdata:
