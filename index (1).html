<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GV Pathshala LMS prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF2F5; --surface:#FFFFFF; --ink:#12202B; --muted:#566774; --line:#D7DFE6;
  --brand:#0B6E75; --brand-ink:#FFFFFF; --brand-soft:#DDF0F1; --accent:#E8A317;
  --ok:#1F8A4C; --bad:#C23B3B; --stage:#10232C;
  --head:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E161C; --surface:#16212A; --ink:#E6EEF3; --muted:#93A4B1; --line:#263644;
    --brand:#4CC1C8; --brand-ink:#06242A; --brand-soft:#173840; --accent:#F0B440;
    --ok:#4CC38A; --bad:#F07878; --stage:#0A1419; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E161C; --surface:#16212A; --ink:#E6EEF3; --muted:#93A4B1; --line:#263644;
  --brand:#4CC1C8; --brand-ink:#06242A; --brand-soft:#173840; --accent:#F0B440;
  --ok:#4CC38A; --bad:#F07878; --stage:#0A1419; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--head);font-weight:700;line-height:1.15;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(1.6rem,3vw,2.1rem)} h2{font-size:1.25rem} h3{font-size:1.05rem}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{background:var(--surface);border-right:1px solid var(--line);padding:22px 16px;display:flex;flex-direction:column;gap:24px;position:sticky;top:0;height:100vh;align-self:start}
.logo{font:700 1.25rem var(--head);display:flex;align-items:center;gap:10px;padding:0 8px}
.logo i{min-width:32px;height:32px;padding:0 6px;border-radius:8px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font:700 .85rem var(--head);font-style:normal;letter-spacing:.02em;border-bottom:3px solid var(--accent)}
nav{display:flex;flex-direction:column;gap:4px}
.nav{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;border:0;background:none;text-align:left;font-weight:500;color:var(--muted)}
.nav svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav:hover{background:var(--bg);color:var(--ink)}
.nav[aria-current="page"]{background:var(--brand-soft);color:var(--brand);font-weight:600}
.me{margin-top:auto;display:flex;flex-direction:column;gap:12px}
.who{display:flex;gap:10px;align-items:center;padding:0 8px}
.av{width:36px;height:36px;border-radius:50%;background:var(--accent);color:#1b1500;display:grid;place-items:center;font-weight:700}
.who small{display:block;color:var(--muted);font-size:.8rem}
.ghost{border:1px solid var(--line);background:none;border-radius:10px;padding:8px 12px;font-weight:500}
.ghost:hover{border-color:var(--brand)}
main{padding:32px clamp(18px,4vw,48px) 64px;max-width:1180px;width:100%}
.crumbs{color:var(--muted);font-size:.9rem;margin-bottom:10px}
.crumbs button{border:0;background:none;padding:0;color:var(--brand);font-weight:500}
.sub{color:var(--muted);margin-top:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.btn{border:0;background:var(--brand);color:var(--brand-ink);padding:11px 18px;border-radius:10px;font-weight:600}
.btn:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.55;cursor:default;filter:none}
.btn.alt{background:none;color:var(--ink);border:1px solid var(--line)}
.btn.alt:hover{border-color:var(--brand)}
.btn.sm{padding:8px 14px;font-size:.92rem}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;margin-top:20px}
.stack{display:flex;flex-direction:column;gap:20px}
.strip{display:flex;gap:3px;margin:14px 0 6px}
.seg{flex:1;height:9px;border-radius:3px;background:var(--line)}
.seg.done{background:var(--brand)} .seg.cur{background:var(--accent)}
.meta{color:var(--muted);font-size:.9rem}
.resume{background:var(--stage);color:#EAF4F6;border:0;padding:28px}
.resume .meta{color:#9FB6BD}
.resume h1{margin:6px 0 4px}
.resume .seg{background:#2A4450} .resume .seg.done{background:#4CC1C8} .resume .seg.cur{background:#F0B440}
.resume .btn{background:#F0B440;color:#1b1500;margin-top:14px}
.list{display:flex;flex-direction:column}
.item{display:flex;gap:14px;align-items:center;padding:14px 0;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.list .item:first-child{border-top:0;padding-top:4px}
button.item:hover .t{color:var(--brand)}
.item .t{font-weight:600}
.pill{font-size:.8rem;padding:2px 10px;border-radius:99px;background:var(--brand-soft);color:var(--brand);font-weight:600;white-space:nowrap}
.pill.warn{background:#FBEBC8;color:#6b4700}
:root[data-theme="dark"] .pill.warn{background:#463511;color:#F0B440}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pill.warn{background:#463511;color:#F0B440}}
.pill.ok{background:#D5EFE0;color:#14633a}
:root[data-theme="dark"] .pill.ok{background:#14382a;color:#4CC38A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pill.ok{background:#14382a;color:#4CC38A}}
.thumb{width:52px;height:52px;border-radius:12px;display:grid;place-items:center;color:#fff;font:700 1.1rem var(--head);flex:none}
.tools{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0}
.search{flex:1;min-width:220px;padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 14px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.course{display:flex;flex-direction:column;gap:10px;padding:0;overflow:hidden}
.course .top{height:92px;padding:14px 16px;display:flex;align-items:flex-end;color:#fff;font:700 1.15rem var(--head)}
.course .body{padding:4px 16px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
.course .body .btn{margin-top:auto}
.mod{margin-top:18px}
.mod h3{margin-bottom:6px}
.lrow{display:flex;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line);width:100%;border-left:0;border-right:0;border-bottom:0;background:none;text-align:left}
.lrow:disabled{cursor:default;opacity:.7}
.lrow:not(:disabled):hover .t{color:var(--brand)}
.st{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:var(--muted)}
.st svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.st.done{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.st.cur{border-color:var(--accent);color:var(--accent)}
.lesson{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;margin-top:18px;align-items:start}
.stage{background:var(--stage);border-radius:14px;color:#EAF4F6;overflow:hidden}
.screen{aspect-ratio:16/9;display:grid;place-items:center;text-align:center;padding:20px;background:radial-gradient(120% 90% at 20% 10%,#1B4651 0,#10232C 60%)}
.screen h2{font-size:clamp(1.1rem,2.4vw,1.6rem);max-width:28ch}
.bigplay{width:72px;height:72px;border-radius:50%;border:0;background:#F0B440;display:grid;place-items:center;margin:0 auto 14px}
.bigplay svg{width:28px;height:28px;fill:#1b1500;margin-left:3px}
.bigplay.on svg{margin-left:0}
.ctrl{display:flex;gap:14px;align-items:center;padding:12px 16px;background:#0A1419}
.track{flex:1;height:10px;background:#2A4450;border-radius:6px;cursor:pointer;position:relative}
.fill{position:absolute;left:0;top:0;bottom:0;background:#F0B440;border-radius:6px;width:0}
.ctrl button{border:0;background:none;color:#EAF4F6;padding:2px}
.ctrl svg{width:20px;height:20px;fill:#EAF4F6;display:block}
.ctrl span{font-variant-numeric:tabular-nums;font-size:.9rem;color:#9FB6BD}
.outline .lrow{padding:10px 0}
.outline .lrow.on .t{color:var(--brand)}
.outline h3{font-size:.95rem;margin:14px 0 2px;color:var(--muted)}
.read p{margin-top:14px;max-width:68ch}
.read h2{margin-top:6px}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--surface);padding:13px 16px;border-radius:12px;margin-top:10px}
.opt:hover{border-color:var(--brand)}
.opt[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}
.opt.right{border-color:var(--ok)} .opt.wrong{border-color:var(--bad)}
.opt .k{width:26px;height:26px;border-radius:7px;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:600;font-size:.85rem;flex:none}
.score{font:700 3rem var(--head)}
.drop{border:2px dashed var(--line);border-radius:14px;padding:30px;text-align:center;margin-top:16px}
.drop input{display:none}
.cm{display:flex;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.cm .av{width:32px;height:32px;font-size:.85rem;flex:none}
textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface);color:var(--ink);font:inherit;min-height:76px;resize:vertical}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:12px 10px;border-top:1px solid var(--line)}
th{font-weight:600;color:var(--muted);font-size:.9rem;border-top:0}
.tablewrap{overflow-x:auto}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:.2s;max-width:90vw;z-index:9}
.toast.show{opacity:1;transform:translate(-50%,0)}
.note{font-size:.85rem;color:var(--muted);margin-top:8px}
.ai .chatlog{max-height:270px;overflow:auto;display:flex;flex-direction:column;gap:8px;margin:12px 0}
.bub{padding:10px 12px;border-radius:12px;background:var(--bg);white-space:pre-line;font-size:.95rem}
.bub.u{background:var(--brand);color:var(--brand-ink);align-self:flex-end;max-width:90%}
.bub.u .src{display:none}
.src{font-size:.8rem;color:var(--muted);margin-top:6px}
.ai .chip{font-size:.85rem;padding:6px 12px;text-align:left}
.ask{display:flex;gap:8px;margin-top:12px}
.ask .search{min-width:0}
.insight{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.insight:first-of-type{border-top:0;padding-top:0}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px 16px;gap:10px;border-right:0;border-bottom:1px solid var(--line)}
  nav{flex-direction:row;overflow-x:auto}
  .me{margin:0 0 0 auto;flex-direction:row;align-items:center}
  .who div{display:none}
  .grid2,.lesson{grid-template-columns:1fr}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="logo"><i>GV</i>GV Pathshala</div>
    <nav id="nav" aria-label="Main"></nav>
    <div class="me">
      <div class="who"><div class="av">AS</div><div>Aarav Sharma<small>Student</small></div></div>
      <button class="ghost" data-a="theme">Switch theme</button>
    </div>
  </aside>
  <main id="main"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ---------- Data ---------- */
const L=(type,id,title,len,sum)=>({type,id,title,len,sum});
const COURSES=[
 {id:'web',title:'Web development fundamentals',short:'WD',cat:'Programming',level:'Beginner',hours:14,rating:4.7,students:1280,by:'Dr. Meera Rao',color:'#0B6E75',
  desc:'Build your first responsive websites with HTML, CSS and JavaScript, finishing with a small working app.',
  modules:[
   {t:'Getting started',l:[L('video','w1','How the web works',9,'Browsers, servers and what happens when you open a link.'),L('reading','w2','Setting up your code editor',6),L('video','w3','Your first web page',12,'Write, save and open a page with headings, links and images.')]},
   {t:'Styling with CSS',l:[L('video','w4','Selectors and the box model',14,'Target elements precisely and control spacing with margin, border and padding.'),L('video','w5','Layout with flexbox',16,'Align and distribute items in a row or column with display: flex.'),L('quiz','w6','Quiz: CSS basics',10)]},
   {t:'Adding behaviour with JavaScript',l:[L('video','w7','Variables and functions',15,'Store values, reuse logic and call functions.'),L('video','w8','Responding to clicks and input',13,'Listen for events and update the page.'),L('assignment','w9','Assignment: build a to-do app',60)]}]},
 {id:'db',title:'Database design with SQL',short:'DB',cat:'Data',level:'Intermediate',hours:11,rating:4.6,students:940,by:'Prof. Kiran Nair',color:'#7A4EAB',
  desc:'Model data with tables and keys, then query it confidently with SELECT, JOIN and GROUP BY.',
  modules:[
   {t:'Relational basics',l:[L('video','d1','Tables, rows and keys',11,'How relational databases organise information.'),L('video','d2','Writing SELECT queries',14,'Filter, sort and limit results.'),L('quiz','d3','Quiz: SELECT queries',10)]},
   {t:'Joins and design',l:[L('video','d4','Joins explained',17,'Combine tables with INNER and LEFT joins.'),L('assignment','d5','Assignment: design a library schema',45)]}]},
 {id:'ds',title:'Data structures in Python',short:'DS',cat:'Programming',level:'Intermediate',hours:18,rating:4.8,students:2105,by:'Dr. Ananya Iyer',color:'#C25A1E',
  desc:'Lists, stacks, queues, trees and graphs, with the reasoning for choosing each one.',
  modules:[{t:'Linear structures',l:[L('video','s1','Lists and arrays',12),L('video','s2','Stacks and queues',15),L('quiz','s3','Quiz: linear structures',10)]},{t:'Trees and graphs',l:[L('video','s4','Binary trees',18),L('video','s5','Graph traversal',20),L('assignment','s6','Assignment: build a maze solver',90)]}]},
 {id:'stats',title:'Statistics for data analysis',short:'ST',cat:'Data',level:'Beginner',hours:9,rating:4.5,students:760,by:'Dr. Rohan Mehta',color:'#2A6FB0',
  desc:'Describe data, understand distributions and test simple hypotheses without heavy maths.',
  modules:[{t:'Describing data',l:[L('video','t1','Mean, median and spread',10),L('video','t2','Reading distributions',12),L('quiz','t3','Quiz: descriptive statistics',8)]}]},
 {id:'ux',title:'UX design basics',short:'UX',cat:'Design',level:'Beginner',hours:8,rating:4.6,students:1530,by:'Neha Kapoor',color:'#B03A64',
  desc:'Research users, sketch flows and test your ideas with simple prototypes.',
  modules:[{t:'Understanding users',l:[L('video','u1','User research in a day',13),L('reading','u2','Writing a problem statement',7),L('assignment','u3','Assignment: sketch a signup flow',40)]}]}
];
const QUIZ={
 w6:[{q:'Which property adds space inside an element, between its content and its border?',o:['margin','padding','gap','outline'],a:1},
     {q:'In the box model, which layer sits outermost?',o:['Content','Padding','Border','Margin'],a:3},
     {q:'What does display: flex on a parent element do?',o:['Hides its children','Lays children out along one axis','Makes text bold','Adds a border'],a:1},
     {q:'Which selector targets the element with id="hero"?',o:['.hero','hero','#hero','*hero'],a:2},
     {q:'Which property aligns flex items along the cross axis?',o:['justify-content','align-items','flex-wrap','order'],a:1}],
 d3:[{q:'Which clause filters rows before they are returned?',o:['ORDER BY','GROUP BY','WHERE','LIMIT'],a:2},
     {q:'Which keyword removes duplicate rows from a result?',o:['UNIQUE','DISTINCT','SINGLE','DROP'],a:1},
     {q:'What does SELECT * FROM books LIMIT 5 return?',o:['Five columns','At most five rows','Only the fifth row','An error'],a:1}]
};
const READ={w2:['Pick an editor you will enjoy opening every day. Visual Studio Code is free, runs on Windows, macOS and Linux, and has a large library of extensions.','Install it, then add two extensions: Live Server to refresh your page when you save, and Prettier to keep your code tidy.','Create a folder called my-site, open it in the editor and add a file named index.html. You will fill it in the next lesson.'],
 u2:['A good problem statement names who is struggling, what they are trying to do and why it matters. It does not mention a solution.','Try this shape: "New students cannot tell which courses to take first, so they delay enrolling." Short, specific and testable.']};
const DUE={w6:'Mon, 19 Oct',w9:'Fri, 23 Oct',d5:'Fri, 30 Oct',d3:'Fri, 23 Oct'};
const ANN=[{t:'Mid-term quiz window opens Monday',b:'Web development fundamentals, Dr. Rao',d:'Today'},{t:'New lab session added for SQL joins',b:'Database design with SQL, Prof. Nair',d:'Yesterday'}];
const ALL=c=>c.modules.flatMap(m=>m.l);
const find=id=>{for(const c of COURSES)for(const l of ALL(c))if(l.id===id)return{c,l}};

/* ---------- State ---------- */
const S={route:'dashboard',cid:null,lid:null,cat:'All',q:'',
 enrolled:new Set(['web','db']),
 done:new Set(['w1','w2','w3','w4','d1']),
 attempts:{},quiz:{i:0,ans:[],sub:false},
 assign:{},comments:{w5:[{n:'Priya S.',t:'Does align-items work in a column layout too?'},{n:'Dr. Meera Rao',t:'Yes. In a column, align-items controls horizontal alignment.'}]},
 file:null};
let timer=null,t=0,playing=false;

/* ---------- Helpers ---------- */
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const fmt=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
const prog=c=>{const a=ALL(c);return a.filter(l=>S.done.has(l.id)).length+'/'+a.length};
const nextOf=c=>ALL(c).find(l=>!S.done.has(l.id))||ALL(c)[0];
const IC={
 dash:'<path d="M3 13h8V3H3zM13 21h8V11h-8zM13 3v6h8V3zM3 21h8v-6H3z"/>',
 book:'<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2zM4 21V5M9 7h6"/>',
 grade:'<path d="M5 3h14v18l-7-4-7 4z"/>',
 check:'<path d="M5 12l5 5 9-10"/>',
 play:'<path d="M8 5l11 7-11 7z"/>',
 read:'<path d="M5 4h14v16H5zM8 9h8M8 13h8"/>',
 quiz:'<path d="M9 9a3 3 0 1 1 4 2.8c-.7.4-1 1-1 1.7M12 17h.01"/>',
 asg:'<path d="M12 16V4M7 9l5-5 5 5M5 20h14"/>'};
const ico=(n,a='')=>`<svg viewBox="0 0 24 24" ${a}>${IC[n]}</svg>`;
const typeIco={video:'play',reading:'read',quiz:'quiz',assignment:'asg'};
const typeName={video:'Video',reading:'Reading',quiz:'Quiz',assignment:'Assignment'};
function toast(m){const e=document.getElementById('toast');e.textContent=m;e.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.remove('show'),2600)}
function strip(c){const a=ALL(c),cur=nextOf(c).id;return `<div class="strip" aria-hidden="true">${a.map(l=>`<span class="seg ${S.done.has(l.id)?'done':l.id===cur?'cur':''}"></span>`).join('')}</div>`}
function stopVideo(){clearInterval(timer);playing=false}

/* ---------- Views ---------- */
function navView(){
 const items=[['dashboard','Dashboard','dash'],['catalog','Course catalog','book'],['grades','Grades','grade']];
 const cur=S.route==='course'||S.route==='lesson'?'catalog':S.route;
 document.getElementById('nav').innerHTML=items.map(([r,n,i])=>`<button class="nav" data-a="go" data-r="${r}" ${cur===r?'aria-current="page"':''}>${ico(i)}${n}</button>`).join('');
}
function dashboard(){
 const c=COURSES[0],nl=nextOf(c),mine=COURSES.filter(x=>S.enrolled.has(x.id));
 const due=Object.entries(DUE).filter(([id])=>{const f=find(id);return f&&S.enrolled.has(f.c.id)&&!S.done.has(id)});
 return `<h1>Welcome back, Aarav</h1><p class="sub">You have ${due.length} items due in the next two weeks.</p>
 <div class="card resume" style="margin-top:22px">
  <div class="meta">Continue learning in ${esc(c.title)}</div>
  <h1>${esc(nl.title)}</h1>
  <div class="meta">${typeName[nl.type]}, ${nl.len} min. You have finished ${prog(c).split('/')[0]} of ${ALL(c).length} lessons.</div>
  ${strip(c)}
  <button class="btn" data-a="lesson" data-id="${nl.id}">Resume lesson</button>
 </div>
 <div class="grid2">
  <section class="card"><h2>My courses</h2><div class="list" style="margin-top:12px">
   ${mine.map(m=>`<button class="item" data-a="course" data-id="${m.id}"><span class="thumb" style="background:${m.color}">${m.short}</span><span style="flex:1"><span class="t">${esc(m.title)}</span><br><span class="meta">${prog(m)} lessons finished, ${esc(m.by)}</span>${strip(m)}</span></button>`).join('')}
  </div></section>
  <div class="stack">
   ${insightsHtml()}<section class="card"><h2>Due soon</h2><div class="list" style="margin-top:12px">
    ${due.map(([id,d])=>{const f=find(id);return `<button class="item" data-a="lesson" data-id="${id}"><span style="flex:1"><span class="t">${esc(f.l.title)}</span><br><span class="meta">${esc(f.c.title)}</span></span><span class="pill warn">${d}</span></button>`}).join('')||'<p class="meta">Nothing due. Nice work.</p>'}
   </div></section>
   <section class="card"><h2>Announcements</h2><div class="list" style="margin-top:12px">
    ${ANN.map(a=>`<div class="item" style="align-items:flex-start"><span style="flex:1"><span class="t">${esc(a.t)}</span><br><span class="meta">${esc(a.b)}</span></span><span class="meta">${a.d}</span></div>`).join('')}
   </div></section>
  </div>
 </div>`;
}
function cardHtml(c){
 const en=S.enrolled.has(c.id);
 return `<article class="card course"><div class="top" style="background:${c.color}">${esc(c.title)}</div>
  <div class="body"><div class="row"><span class="pill">${c.cat}</span><span class="meta">${c.level}</span></div>
  <p class="meta">${esc(c.by)}. ${c.hours} hours, rated ${c.rating} by ${c.students.toLocaleString('en-IN')} students.</p>
  ${en?strip(c):''}
  <button class="btn ${en?'alt':''}" data-a="course" data-id="${c.id}">${en?'Open course':'View course'}</button></div></article>`;
}
function filtered(){return COURSES.filter(c=>(S.cat==='All'||c.cat===S.cat)&&(c.title+c.by+c.cat).toLowerCase().includes(S.q.toLowerCase()))}
function gridHtml(){const f=filtered();return f.length?f.map(cardHtml).join(''):'<p class="meta">No courses match. Clear the search or pick another category.</p>'}
function catalog(){
 const cats=['All','Programming','Data','Design'];
 return `<h1>Course catalog</h1><p class="sub">Find a course and enroll in one click.</p>
 <div class="tools"><input class="search" id="q" type="search" placeholder="Search by title, instructor or category" aria-label="Search courses" value="${esc(S.q)}">
 <div class="chips" id="chips">${cats.map(c=>`<button class="chip" aria-pressed="${S.cat===c}" data-a="cat" data-id="${c}">${c}</button>`).join('')}</div></div>
 <div class="cards" id="grid">${gridHtml()}</div>`;
}
function course(){
 const c=COURSES.find(x=>x.id===S.cid),en=S.enrolled.has(c.id),a=ALL(c),n=a.filter(l=>S.done.has(l.id)).length,cur=nextOf(c).id;
 return `<div class="crumbs"><button data-a="go" data-r="catalog">Course catalog</button> / ${esc(c.title)}</div>
 <h1>${esc(c.title)}</h1><p class="sub" style="max-width:62ch">${esc(c.desc)}</p>
 <div class="grid2">
  <section class="card"><h2>Course content</h2>
   ${c.modules.map(m=>`<div class="mod"><h3>${esc(m.t)}</h3>${m.l.map(l=>{
     const d=S.done.has(l.id);
     return `<button class="lrow" data-a="lesson" data-id="${l.id}" ${en?'':'disabled'}><span class="st ${d?'done':l.id===cur&&en?'cur':''}">${d?ico('check'):ico(typeIco[l.type])}</span><span style="flex:1"><span class="t">${esc(l.title)}</span><br><span class="meta">${typeName[l.type]}, ${l.len} min</span></span></button>`}).join('')}</div>`).join('')}
  </section>
  <aside class="stack"><div class="card">
   <div class="meta">Taught by</div><h3 style="margin:2px 0 12px">${esc(c.by)}</h3>
   <p class="meta">${c.level}, ${c.hours} hours, ${a.length} lessons</p>
   ${en?`${strip(c)}<p class="meta">${n} of ${a.length} lessons finished</p><div class="row" style="margin-top:14px"><button class="btn" data-a="lesson" data-id="${cur}">${n?'Continue':'Start course'}</button>
   ${n===a.length?'<button class="btn alt" data-a="cert">Get certificate</button>':''}</div>`
   :`<div style="margin-top:14px"><button class="btn" data-a="enroll" data-id="${c.id}">Enroll for free</button></div><p class="note">Lessons unlock after you enroll.</p>`}
  </div></aside>
 </div>`;
}
function stageHtml(l){
 return `<div class="stage"><div class="screen"><div><button class="bigplay" id="bp" data-a="play" aria-label="Play video">${ico('play')}</button><h2>${esc(l.title)}</h2></div></div>
 <div class="ctrl"><button data-a="play" aria-label="Play or pause" id="pp">${ico('play')}</button>
 <div class="track" id="track" role="slider" aria-label="Seek" aria-valuemin="0" aria-valuemax="${l.len*60}" tabindex="0"><div class="fill" id="fill"></div></div><span id="time">0:00 / ${fmt(l.len*60)}</span></div></div>
 <p class="note">Demo playback runs faster than real time so you can try the flow.</p>
 <p style="margin-top:14px;max-width:68ch">${esc(l.sum||'Watch the lesson, then mark it complete to unlock the next one.')}</p>`;
}
function readHtml(l){return `<div class="card read"><h2>${esc(l.title)}</h2>${(READ[l.id]||['Reading content appears here.']).map(p=>`<p>${esc(p)}</p>`).join('')}</div>`}
function quizHtml(l){
 const Q=QUIZ[l.id]||QUIZ.w6,q=S.quiz;
 if(q.sub){
  const sc=Q.reduce((s,x,i)=>s+(q.ans[i]===x.a?1:0),0),pct=Math.round(sc/Q.length*100),pass=pct>=60;
  return `<div class="card"><div class="score">${sc}/${Q.length}</div><div class="row" style="margin-top:6px"><span class="pill ${pass?'ok':'warn'}">${pass?'Passed':'Not passed'}</span><span class="meta">${pct}%, pass mark 60%</span></div>
  ${Q.map((x,i)=>`<div style="margin-top:20px"><h3>${i+1}. ${esc(x.q)}</h3>${x.o.map((o,j)=>`<div class="opt ${j===x.a?'right':q.ans[i]===j?'wrong':''}"><span class="k">${'ABCD'[j]}</span>${esc(o)}${j===x.a?' (correct)':q.ans[i]===j?' (your answer)':''}</div>`).join('')}</div>`).join('')}
  <div class="row" style="margin-top:22px"><button class="btn alt" data-a="retake">Retake quiz</button></div></div>`;
 }
 const x=Q[q.i],last=q.i===Q.length-1;
 return `<div class="card"><div class="meta">Question ${q.i+1} of ${Q.length}. Pass mark 60%.</div>
 <div class="strip">${Q.map((_,i)=>`<span class="seg ${q.ans[i]!==undefined?'done':i===q.i?'cur':''}"></span>`).join('')}</div>
 <h2 style="margin:14px 0 6px">${esc(x.q)}</h2>
 ${x.o.map((o,j)=>`<button class="opt" aria-pressed="${q.ans[q.i]===j}" data-a="pick" data-id="${j}"><span class="k">${'ABCD'[j]}</span>${esc(o)}</button>`).join('')}
 <div class="row" style="margin-top:20px;justify-content:space-between"><button class="btn alt" data-a="qnav" data-id="-1" ${q.i===0?'disabled':''}>Previous</button>
 ${last?`<button class="btn" data-a="qsubmit" ${q.ans.filter(v=>v!==undefined).length<Q.length?'disabled':''}>Submit quiz</button>`:`<button class="btn" data-a="qnav" data-id="1" ${q.ans[q.i]===undefined?'disabled':''}>Next question</button>`}</div></div>`;
}
function assignHtml(l){
 const a=S.assign[l.id];
 return `<div class="card"><h2>${esc(l.title)}</h2><p class="meta" style="margin-top:6px">Due ${DUE[l.id]||'Fri, 30 Oct'}. Upload a .zip or .pdf up to 20 MB.</p>
 <p style="margin-top:14px;max-width:62ch">Build a small to-do list that adds, completes and deletes items. Include a short README that explains how to run it.</p>
 ${a?`<div class="drop"><span class="pill ok">Submitted</span><p style="margin-top:10px"><strong>${esc(a.name)}</strong></p><p class="meta">Waiting for your instructor to grade it. Feedback will appear here and under Grades.</p></div><div class="card" style="margin-top:16px"><div class="row" style="justify-content:space-between"><h3>AI feedback draft</h3><span class="pill warn">Pending instructor review</span></div><p style="margin-top:10px"><strong>What works:</strong> the structure is clear and the README explains how to run the project.</p><p style="margin-top:8px"><strong>To improve:</strong> add input validation so empty tasks cannot be saved, and split the click handlers into small named functions.</p><p style="margin-top:8px"><strong>Suggested range:</strong> 70 to 80 out of 100. Your instructor sets the final grade.</p></div>`
 :`<div class="drop"><label><input type="file" id="file" accept=".zip,.pdf"><span class="btn alt" style="display:inline-block;cursor:pointer">Choose a file</span></label><p class="meta" style="margin-top:10px" id="fname">${S.file?esc(S.file):'No file chosen'}</p></div>
 <div class="row" style="margin-top:16px"><button class="btn" data-a="submitA" ${S.file?'':'disabled'} id="sa">Submit assignment</button></div>`}</div>`;
}
function lesson(){
 const f=find(S.lid),{c,l}=f,done=S.done.has(l.id);
 const body=l.type==='video'?stageHtml(l):l.type==='reading'?readHtml(l):l.type==='quiz'?quizHtml(l):assignHtml(l);
 const cm=S.comments[l.id]||[];
 return `<div class="crumbs"><button data-a="course" data-id="${c.id}">${esc(c.title)}</button> / ${esc(l.title)}</div>
 <h1>${esc(l.title)}</h1>
 <div class="lesson"><div>
  ${body}
  ${(l.type==='video'||l.type==='reading')?`<div class="row" style="margin-top:18px"><button class="btn" data-a="complete" ${done?'disabled':''}>${done?'Completed':'Mark as complete'}</button><button class="btn alt" data-a="next">Next lesson</button></div>`:`<div class="row" style="margin-top:18px"><button class="btn alt" data-a="next">Next lesson</button></div>`}
  <section class="card" style="margin-top:22px"><h2>Discussion</h2>
   ${cm.map(m=>`<div class="cm"><div class="av">${esc(m.n.split(' ').map(w=>w[0]).join('').slice(0,2))}</div><div><strong>${esc(m.n)}</strong><p>${esc(m.t)}</p></div></div>`).join('')||'<p class="meta" style="margin-top:8px">No questions yet. Ask the first one.</p>'}
   <div style="margin-top:14px"><textarea id="cmt" placeholder="Ask a question or share a tip" aria-label="Write a comment"></textarea><div class="row" style="margin-top:10px"><button class="btn sm" data-a="post">Post comment</button></div></div>
  </section></div>
  <aside class="stack outline">${tutorHtml(l)}<section class="card"><h2>Lessons</h2>${c.modules.map(m=>`<h3>${esc(m.t)}</h3>${m.l.map(x=>`<button class="lrow ${x.id===l.id?'on':''}" data-a="lesson" data-id="${x.id}"><span class="st ${S.done.has(x.id)?'done':x.id===l.id?'cur':''}">${S.done.has(x.id)?ico('check'):ico(typeIco[x.type])}</span><span class="t" style="flex:1">${esc(x.title)}</span></button>`).join('')}`).join('')}</section></aside>
 </div>`;
}
function grades(){
 const rows=COURSES.filter(c=>S.enrolled.has(c.id)).flatMap(c=>ALL(c).filter(l=>l.type==='quiz'||l.type==='assignment').map(l=>({c,l})));
 return `<h1>Grades</h1><p class="sub">Quiz scores and assignment status for your courses.</p>
 <div class="card tablewrap" style="margin-top:20px"><table><thead><tr><th>Item</th><th>Course</th><th>Type</th><th>Due</th><th>Result</th></tr></thead><tbody>
 ${rows.map(({c,l})=>{let r='<span class="pill warn">Not started</span>';
  if(l.type==='quiz'&&S.attempts[l.id])r=`<span class="pill ${S.attempts[l.id].pass?'ok':'warn'}">${S.attempts[l.id].sc}/${S.attempts[l.id].n}</span>`;
  if(l.type==='assignment'&&S.assign[l.id])r='<span class="pill">Submitted, awaiting grade</span>';
  return `<tr><td><button class="ghost" style="border:0;padding:0;color:var(--brand);font-weight:600" data-a="lesson" data-id="${l.id}">${esc(l.title)}</button></td><td>${esc(c.title)}</td><td>${typeName[l.type]}</td><td>${DUE[l.id]||'Not set'}</td><td>${r}</td></tr>`}).join('')}
 </tbody></table></div>`;
}

/* ---------- AI features (scripted demo) ---------- */
const KB=[
 {k:['flex','justify','align','axis'],a:'In a flex container, justify-content spreads items along the main axis and align-items places them on the cross axis. In a row layout the main axis is horizontal.',src:'Layout with flexbox'},
 {k:['margin','padding','box model','border'],a:'The box model has four layers from the inside out: content, padding, border and margin. Padding is space inside the border and margin is space outside it.',src:'Selectors and the box model'},
 {k:['selector','class'],a:'A class selector starts with a dot, like .card, and can be reused. An id selector starts with #, like #hero, and should appear once per page.',src:'Selectors and the box model'},
 {k:['function','variable','const'],a:'A variable stores a value using let or const. A function wraps reusable steps so you can call it by name with different inputs.',src:'Variables and functions'},
 {k:['join','sql','select','where'],a:'SELECT picks columns, WHERE filters rows and JOIN combines rows from two tables that share a key.',src:'Database design with SQL'},
 {k:['deadline','due','submit'],a:'Your next deadlines are the CSS quiz on Mon, 19 Oct and the to-do app assignment on Fri, 23 Oct.',src:'Course schedule'},
 {k:['quiz','pass'],a:'Quizzes have a 60% pass mark and you can retake them as many times as you like.',src:'Course rules'}];
function tutorReply(l,text){
 const s=text.toLowerCase();
 if(/this lesson|simply|summar/.test(s))return {a:'In short: '+(l.sum||l.title+'. Watch the lesson, then try the example yourself.'),src:l.title};
 if(/practice|quiz me|test me/.test(s))return {a:'Here are three practice questions on "'+l.title+'":\n1. Explain the main idea in your own words.\n2. Write a short example that uses it.\n3. What mistake would a beginner make here, and how would you fix it?',src:l.title};
 const hit=KB.find(e=>e.k.some(k=>s.includes(k)));
 if(hit)return {a:hit.a,src:hit.src};
 return {a:"I can't find that in this course's material, so I won't guess. Try rephrasing, or post it in the discussion for your instructor.",src:null};
}
function chatHtml(){
 const m=(S.chat&&S.chat[S.lid])||[];
 return '<div class="bub">Hi Aarav, I am your course tutor. Ask me about this lesson or the course.</div>'+m.map(x=>`<div class="bub ${x.r}">${esc(x.t)}${x.src?`<div class="src">Source: ${esc(x.src)}</div>`:''}</div>`).join('');
}
function chatUpd(){const e=document.getElementById('chatlog');if(e){e.innerHTML=chatHtml();e.scrollTop=e.scrollHeight}}
function tutorHtml(l){
 const chips=['Explain this lesson simply','Give me practice questions','When is my next deadline?'];
 return `<section class="card ai"><div class="row" style="justify-content:space-between"><h2>AI tutor</h2><span class="pill warn">Demo</span></div>
 <div class="chatlog" id="chatlog" aria-live="polite">${chatHtml()}</div>
 <div class="chips">${chips.map(c=>`<button class="chip" data-a="ask" data-id="${esc(c)}">${esc(c)}</button>`).join('')}</div>
 <div class="ask"><input class="search" id="aiq" placeholder="Ask about this course" aria-label="Ask the AI tutor"><button class="btn sm" data-a="ask">Ask</button></div>
 <p class="note">Prototype replies are scripted. The real version answers from your course material and cites the lesson.</p></section>`;
}
const TOPIC={w6:['Box model','Box model','Flexbox','Selectors','Flexbox']};
function insightsHtml(){
 const a=S.attempts.w6;let weak;
 if(a){const miss={};QUIZ.w6.forEach((x,i)=>{if(a.ans[i]!==x.a){const t=TOPIC.w6[i];miss[t]=(miss[t]||0)+1}});
  const k=Object.keys(miss).sort((x,y)=>miss[y]-miss[x])[0];
  weak=k?`You missed ${miss[k]} question${miss[k]>1?'s':''} on ${k}. Revisit that lesson, then ask the tutor for practice questions.`:'You answered every CSS question correctly. You are ready for JavaScript.';}
 else weak='Take the CSS basics quiz and the analyzer will point out topics to revisit.';
 const web=COURSES[0],left=ALL(web).filter(l=>!S.done.has(l.id)).length,weeks=Math.max(1,Math.ceil(left/3));
 const eta=new Date(2026,9,14+weeks*7).toLocaleDateString('en-IN',{day:'numeric',month:'short'});
 const recs=[{id:'ds',why:'You are working through web basics. This builds the problem solving behind larger apps.'},{id:'ux',why:'Pairs well with front-end skills: learn to design what you build.'}].filter(r=>!S.enrolled.has(r.id));
 return `<section class="card"><div class="row" style="justify-content:space-between"><h2>Learning insights</h2><span class="pill">AI analyzer</span></div>
 <div class="insight"><div class="t">Pace</div><p class="meta">${left} lessons left in ${esc(web.title)}. At 3 lessons a week you finish around ${eta}.</p></div>
 <div class="insight"><div class="t">Topic to revisit</div><p class="meta">${weak}</p></div>
 ${recs.length?`<div class="insight"><div class="t">Recommended next</div>${recs.map(r=>{const c=COURSES.find(x=>x.id===r.id);return `<button class="item" style="padding:10px 0 0;border:0" data-a="course" data-id="${c.id}"><span class="thumb" style="background:${c.color};width:40px;height:40px;font-size:.9rem">${c.short}</span><span><span class="t">${esc(c.title)}</span><br><span class="meta">${esc(r.why)}</span></span></button>`}).join('')}</div>`:''}
 <p class="note">Prototype insights use your activity in this session. The real analyzer uses your full history.</p></section>`;
}
document.addEventListener('keydown',e=>{if(e.target.id==='aiq'&&e.key==='Enter')A.ask({})});

/* ---------- Render + events ---------- */
function render(){
 stopVideo();navView();
 const v={dashboard,catalog,course,lesson,grades}[S.route];
 document.getElementById('main').innerHTML=v();
 const q=document.getElementById('q');
 if(q)q.addEventListener('input',e=>{S.q=e.target.value;document.getElementById('grid').innerHTML=gridHtml()});
 const fi=document.getElementById('file');
 if(fi)fi.addEventListener('change',e=>{const f=e.target.files[0];S.file=f?f.name:null;document.getElementById('fname').textContent=S.file||'No file chosen';document.getElementById('sa').disabled=!S.file});
 const tr=document.getElementById('track');
 if(tr){const seek=ev=>{const r=tr.getBoundingClientRect(),L=find(S.lid).l.len*60;t=Math.max(0,Math.min(L,(ev.clientX-r.left)/r.width*L));paint()};tr.addEventListener('click',seek)}
}
function paint(){
 const L=find(S.lid).l.len*60,f=document.getElementById('fill');if(!f)return;
 f.style.width=(t/L*100)+'%';document.getElementById('time').textContent=fmt(t)+' / '+fmt(L);
 const pl=playing?'<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>':IC.play;
 document.querySelector('#pp svg').innerHTML=pl;document.querySelector('#bp svg').innerHTML=pl;
 document.getElementById('bp').classList.toggle('on',playing);
}
function go(r,o={}){Object.assign(S,{route:r},o);render();window.scrollTo(0,0)}
function openLesson(id){
 const {c,l}=find(id);if(!S.enrolled.has(c.id)){toast('Enroll in this course to open its lessons.');return}
 t=0;S.file=null;
 if(l.type==='quiz'){const a=S.attempts[id];S.quiz=a?{i:0,ans:a.ans,sub:true}:{i:0,ans:[],sub:false}}
 go('lesson',{cid:c.id,lid:id});
}
const A={
 go:d=>go(d.r),
 theme:()=>{const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=dark?'light':'dark'},
 course:d=>go('course',{cid:d.id}),
 lesson:d=>openLesson(d.id),
 enroll:d=>{S.enrolled.add(d.id);toast('You are enrolled. Your first lesson is ready.');render()},
 cat:d=>{S.cat=d.id;render()},
 play:()=>{const L=find(S.lid).l.len*60;if(playing){stopVideo()}else{if(t>=L)t=0;playing=true;timer=setInterval(()=>{t=Math.min(L,t+6);if(t>=L){stopVideo();toast('Video finished. Mark the lesson as complete.')}paint()},200)}paint()},
 complete:()=>{S.done.add(S.lid);toast('Lesson marked complete.');render()},
 next:()=>{const c=COURSES.find(x=>x.id===S.cid),a=ALL(c),i=a.findIndex(l=>l.id===S.lid);if(i<a.length-1)openLesson(a[i+1].id);else{toast('That was the last lesson in this course.');go('course',{cid:c.id})}},
 pick:d=>{S.quiz.ans[S.quiz.i]=+d.id;render()},
 qnav:d=>{S.quiz.i+=+d.id;render()},
 qsubmit:()=>{const Q=QUIZ[S.lid]||QUIZ.w6,sc=Q.reduce((s,x,i)=>s+(S.quiz.ans[i]===x.a?1:0),0),pass=sc/Q.length>=.6;
  S.quiz.sub=true;S.attempts[S.lid]={sc,n:Q.length,pass,ans:S.quiz.ans.slice()};
  if(pass){S.done.add(S.lid);toast('You passed. Lesson marked complete.')}else toast('Not passed yet. Review the answers and retake.');render()},
 retake:()=>{S.quiz={i:0,ans:[],sub:false};render()},
 submitA:()=>{S.assign[S.lid]={name:S.file};S.done.add(S.lid);toast('Assignment submitted.');render()},
 post:()=>{const v=document.getElementById('cmt').value.trim();if(!v){toast('Write a comment first.');return}(S.comments[S.lid]=S.comments[S.lid]||[]).push({n:'Aarav Sharma',t:v});render()},
 cert:()=>toast('In the full system this downloads a PDF certificate.'),
 ask:d=>{const i=document.getElementById('aiq'),text=(d.id||(i?i.value:'')).trim();if(!text)return;if(i)i.value='';
  const lid=S.lid,l=find(lid).l;S.chat=S.chat||{};const log=S.chat[lid]=S.chat[lid]||[];log.push({r:'u',t:text});chatUpd();
  setTimeout(()=>{const r=tutorReply(l,text);log.push({r:'b',t:r.a,src:r.src});chatUpd()},500)}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(el&&!el.disabled)A[el.dataset.a](el.dataset)});
render();
</script>
